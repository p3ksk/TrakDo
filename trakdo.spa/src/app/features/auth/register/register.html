<div class="auth-container">
  <div class="auth-card">
    <div class="card-header">
      <div class="logo-container">
        <img class="logo-img" src="/assets/icon-small.png" alt="logo"/>
        <h1 class="logo-text">TaskFlow</h1>
      </div>
      <p class="subtitle">Create your account and start organizing</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group app-form-group" [class.has-error]="username?.invalid && username?.touched">
        <label for="username" class="form-label app-form-label">Username</label>
        <div class="input-wrapper">
          <input
            id="username"
            type="text"
            formControlName="username"
            class="form-input app-form-control"
            placeholder="johndoe"
            [class.error]="username?.invalid && username?.touched"
          />
          <span class="input-icon">👤</span>
        </div>
        <span class="error-message" *ngIf="username?.invalid && username?.touched">
          <span *ngIf="username?.errors?.['required']">Username is required</span>
          <span *ngIf="username?.errors?.['minlength']">Username must be at least 3 characters</span>
        </span>
      </div>

      <div class="form-group app-form-group" [class.has-error]="password?.invalid && password?.touched">
        <label for="password" class="form-label app-form-label">Password</label>
        <div class="input-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            class="form-input app-form-control"
            placeholder="Create a password"
            [class.error]="password?.invalid && password?.touched"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
            tabindex="-1"
          >
            {{ showPassword ? '👁' : '👁‍🗨' }}
          </button>
        </div>
        <span class="error-message" *ngIf="password?.invalid && password?.touched">
          <span *ngIf="password?.errors?.['required']">Password is required</span>
          <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
        </span>
      </div>

      <div class="form-group app-form-group" [class.has-error]="confirmPassword?.invalid && confirmPassword?.touched">
        <label for="confirmPassword" class="form-label app-form-label">Confirm Password</label>
        <div class="input-wrapper">
          <input
            id="confirmPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            formControlName="confirmPassword"
            class="form-input app-form-control"
            placeholder="Confirm your password"
            [class.error]="confirmPassword?.invalid && confirmPassword?.touched"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="toggleConfirmPassword()"
            tabindex="-1"
          >
            {{ showConfirmPassword ? '👁' : '👁‍🗨' }}
          </button>
        </div>
        <span class="error-message" *ngIf="confirmPassword?.invalid && confirmPassword?.touched">
          <span *ngIf="confirmPassword?.errors?.['required']">Please confirm your password</span>
          <span *ngIf="confirmPassword?.errors?.['passwordMismatch']">Passwords don't match</span>
        </span>
      </div>

      <div class="error-alert" *ngIf="errorMessage">
        <span class="alert-icon">⚠</span>
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="submit-btn app-modal-btn app-modal-btn-primary"
        [disabled]="registerForm.invalid || isLoading"
        [class.loading]="isLoading"
      >
        @if (isLoading) {
          <span class="loader"></span>
        }
        @else {
          <span>Create Account</span>
        }
      </button>

      <div class="auth-footer">
        <p class="footer-text">
          Already have an account?
          <a routerLink="/auth/login" class="auth-link">Sign in</a>
        </p>
      </div>
    </form>
  </div>

</div>
