<div class="auth-container">
  <div class="auth-card">
    <div class="card-header">
      <div class="logo-container">
        <img class="logo-img" src="/assets/icon-small.png" alt="logo"/>
        <h1 class="logo-text">TrakDo</h1>
      </div>
      <p class="subtitle">Welcome back! Sign in to your account</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group app-form-group" [class.has-error]="username?.invalid && username?.touched">
        <label for="username" class="form-label app-form-label">Username</label>
        <div class="input-wrapper">
          <input
            id="username"
            type="text"
            formControlName="username"
            class="form-input app-form-control"
            placeholder="Enter your username"
            [class.error]="username?.invalid && username?.touched"
          />
          <span class="input-icon">✉</span>
        </div>
        <span class="error-message" *ngIf="username?.invalid && username?.touched">
          <span *ngIf="username?.errors?.['required']">Username is required</span>
        </span>
      </div>

      <div class="form-group app-form-group" [class.has-error]="password?.invalid && password?.touched">
        <label for="password" class="form-label app-form-label">Password</label>
        <div class="input-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            class="form-input app-form-control"
            placeholder="Enter your password"
            [class.error]="password?.invalid && password?.touched"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
            tabindex="-1"
          >
            {{ showPassword ? '👁' : '👁‍🗨' }}
          </button>
        </div>
        <span class="error-message" *ngIf="password?.invalid && password?.touched">
          <span *ngIf="password?.errors?.['required']">Password is required</span>
          <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
        </span>
      </div>

      <div class="error-alert" *ngIf="errorMessage">
        <span class="alert-icon">⚠</span>
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="submit-btn app-modal-btn app-modal-btn-primary"
        [disabled]="loginForm.invalid || isLoading"
        [class.loading]="isLoading"
      >
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading" class="loader"></span>
      </button>

      <div class="auth-footer">
        <p class="footer-text">
          Don't have an account?
          <a routerLink="/auth/register" class="auth-link">Create one</a>
        </p>
      </div>
    </form>
  </div>

</div>
