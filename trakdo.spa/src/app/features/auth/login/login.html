<div class="auth-card">
  <div class="auth-brand">
    <img src="/assets/icon-small.png" alt=""/>
    <span>TrakDo</span>
  </div>
  <h1 class="auth-title">Welcome back</h1>
  <p class="auth-subtitle">Sign in to pick up where your timers left off.</p>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form" novalidate>
    <div class="field">
      <label for="username" class="field-label">Username</label>
      <input id="username" type="text" formControlName="username" class="input" autocomplete="username" autofocus
             [class.is-invalid]="username?.invalid && username?.touched"/>
      @if (username?.invalid && username?.touched) {
        <span class="field-error">Enter your username.</span>
      }
    </div>

    <div class="field">
      <label for="password" class="field-label">Password</label>
      <div class="password-wrap">
        <input id="password" [type]="showPassword() ? 'text' : 'password'" formControlName="password" class="input"
               autocomplete="current-password" [class.is-invalid]="password?.invalid && password?.touched"/>
        <button type="button" class="btn btn-ghost btn-icon btn-sm password-toggle" (click)="showPassword.set(!showPassword())"
                [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showPassword()">
          <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="17"/>
        </button>
      </div>
      @if (password?.invalid && password?.touched) {
        <span class="field-error">Enter your password.</span>
      }
    </div>

    @if (errorMessage()) {
      <div class="auth-error" role="alert">
        <app-icon name="alert" [size]="16"/>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <button type="submit" class="btn btn-primary btn-block auth-submit" [disabled]="isLoading()">
      @if (isLoading()) {
        <span class="spinner" aria-hidden="true"></span>
        <span class="visually-hidden">Signing in…</span>
      } @else {
        Sign in
      }
    </button>
  </form>

  <p class="auth-footer">
    New to TrakDo? <a routerLink="/auth/register">Create an account</a>
  </p>
</div>
