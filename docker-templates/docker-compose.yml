services:
  mariadb:
    image: docker.io/library/mariadb:10
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpassword}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-MyApp}
      MARIADB_USER: ${MARIADB_USER:-myappUser}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-myappPassword}
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - myapp_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -p$$MARIADB_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/MyApp.Api/Dockerfile
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MySqlServer: "server=mariadb;port=3306;database=${MARIADB_DATABASE:-MyApp};user=${MARIADB_USER:-myappUser};password=${MARIADB_PASSWORD:-myappPassword};"
      SecretKey: ${SecretKey}
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/myapp-web/Dockerfile
    ports:
      - "${SPA_PORT:-4200}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  myapp_db_data:
